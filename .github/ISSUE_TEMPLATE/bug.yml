name: "Erro"
description: "Algo não funciona como deveria"
title: "fix: "
labels: ["tipo: bug"]
body:
  - type: markdown
    attributes:
      value: "Não cole dados pessoais reais nem senhas ou chaves (LGPD). Uma issue, uma branch, um PR. Marque a semana no kanban."
  - type: textarea
    id: o_que_aconteceu
    attributes:
      label: "O que aconteceu?"
    validations:
      required: true
  - type: textarea
    id: como_reproduzir
    attributes:
      label: "Como reproduzir?"
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: "O que deveria acontecer?"
    validations:
      required: true
  - type: input
    id: ambiente
    attributes:
      label: Ambiente
      description: Navegador, sistema ou versão, se souber.
    validations:
      required: false
  - type: textarea
    id: criterios
    attributes:
      label: Critérios de aceite
      description: Como saberemos que está pronto? Uma linha por item.
      value: "- [ ] "
    validations:
      required: true
  - type: dropdown
    id: semana
    attributes:
      label: Semana
      description: Em que semana do roadmap isto entra?
      options:
        - Semana 1
        - Semana 2
        - Semana 3
        - Semana 4
        - Semana 5
        - Semana 6
        - Semana 7
        - Backlog (sem semana)
    validations:
      required: true
  - type: dropdown
    id: repo
    attributes:
      label: Repositório afetado
      description: Marque todos os repositórios que a tarefa toca.
      multiple: true
      options:
        - artemishub_orchestration
        - artemishub_docs
        - artemishub_frontend
        - artemishub_backend
        - artemishub_agents
        - artemishub_rag
        - .github
    validations:
      required: true
